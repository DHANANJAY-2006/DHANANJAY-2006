name: Generate trophy card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Debug GraphQL with GITHUB_TOKEN
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "User-Agent: Actions" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"query userInfo($username: String!) { user(login: $username) { createdAt contributionsCollection { totalCommitContributions } } }","variables":{"username":"DHANANJAY-2006"}}')
          echo "GraphQL Response: $RESPONSE"

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Checkout generator and apply fix
        run: |
          git clone --branch feature/generate-svg --depth 1 https://github.com/Erik-Donath/github-profile-trophy.git trophy-gen
          python3 -c "
          code = '''import {
            EServiceKindError,
            ServiceError,
          } from \"../Types/index.ts\";

          export async function requestGithubData<T = unknown>(
            query: string,
            variables: { [key: string]: string },
            token = \"\",
          ) {
            const res = await fetch(\"https://api.github.com/graphql\", {
              method: \"POST\",
              headers: {
                \"Content-Type\": \"application/json\",
                \"Authorization\": \`bearer \${token}\`,
                \"User-Agent\": \"github-profile-trophy\",
              },
              body: JSON.stringify({ query, variables }),
            });
            const responseData = await res.json();
            console.log(\"Fetch status:\", res.status, JSON.stringify(responseData));
            if (responseData?.data?.user) {
              return responseData.data.user;
            }
            throw new ServiceError(\"Not found\", EServiceKindError.NOT_FOUND);
          }
          '''
          with open('trophy-gen/src/Services/request.ts', 'w') as f:
              f.write(code)
          "

      - name: generate trophy.svg
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write \
            trophy-gen/render_svg.ts \
            "${{ github.repository_owner }}" \
            --file "dist/trophy.svg" \
            --theme "dracula" \
            --rows "1" \
            --margin-width "8" \
            --margin-height "8"

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
